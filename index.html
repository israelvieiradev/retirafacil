<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="imagens/icone-retirafacil.png">
    <link rel="stylesheet" href="style.css">

    <title>Retira Fácil</title>
</head>
<body>
    <main id="principal">
        <form action="POST" id="login">
            <figure id="container-imagem">
                <img src="imagens/logo-retirafacil.png" alt="logo-retirafacil" id="imagem">
            </figure>
            <section class="campo-form">
                <label for="usuario" class="label-login">Usuário: </label>
                <input type="text" class="input-login" id="usuario" placeholder="usuário">
            </section>

            <section class="campo-form">
                <label for="senha" class="label-login">Senha: </label>
                <input type="password" class="input-login" id="senha" placeholder="senha">
            </section>
            <button id="btn-entrar">Entrar</button>
        </form>
    </main>
</body>
</html>
