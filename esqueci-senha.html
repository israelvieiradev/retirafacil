<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tela de login para um projeto escalável com a ideia de agendamento para retirada de produtos reunindo parcerias com e-commerces.">
    <meta name="keywords" content="login, retirafacil, projeto, portifólio, e-commerce, produto, agendamento">

    <!-- Open Graph -->

    <link rel="icon" type="image/png" href="imagens/icone-retirafacil.png">

<body>
    <main id="principal">
        <form action="POST" id="login">
            <section class="campo-form">
                <label for="email" class="label-geral">E-mail:</label>
                <input type="email" class="input-geral" name="email" id="email" placeholder="e-mail" required>

            <button id="btn-form" type="submit">Enviar</button>
        </form>
        <a id="link-voltar" href="index.html">Voltar</a>
    </main>
